<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Spam Detector</title>

<!-- NOTE: the Play CDN is for demos only — it generates styles in the browser.
     For production, build Tailwind with the CLI and ship a static CSS file. -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: "#111827"
      }
    }
  }
}
</script>
</head>

<body class="h-screen overflow-hidden bg-gray-100 flex items-center justify-center">

<main class="w-full max-w-6xl h-[90vh] bg-white rounded-2xl shadow-xl flex flex-col">

<!-- HEADER -->
<header class="flex items-center justify-between px-6 py-4 border-b">
  <div class="flex items-center gap-2 font-semibold text-lg">
    <span class="material-icons-round">security</span>
    SMS Spam Detector
  </div>
</header>

<!-- CONTENT -->
<div class="flex flex-1 overflow-hidden">

<!-- LEFT -->
<section class="w-1/2 p-10 flex flex-col">
  <h1 class="text-4xl font-bold mb-2">Spam Detection AI</h1>
  <p class="text-gray-500 mb-6">
    Analyze any SMS message instantly to detect potential threats or spam content.
  </p>

  <label for="message" class="sr-only">Message to analyze</label>
  <textarea
    id="message"
    maxlength="1000"
    aria-describedby="char-count"
    class="w-full h-48 p-6 rounded-2xl border text-lg resize-none focus:outline-none focus:ring-2 focus:ring-black"
    placeholder="Paste your SMS message here to analyze..."></textarea>

  <div class="flex items-center justify-between mt-1">
    <div class="flex gap-3">
      <button type="button" onclick="setSpam()" class="px-4 py-2 bg-gray-100 rounded-lg text-sm hover:bg-gray-200 transition">Spam Example</button>
      <button type="button" onclick="setHam()"  class="px-4 py-2 bg-gray-100 rounded-lg text-sm hover:bg-gray-200 transition">Ham Example</button>
    </div>
    <span id="char-count" class="text-xs text-gray-400">0 / 1000</span>
  </div>

  <button
    type="button"
    id="analyze-btn"
    class="mt-8 py-4 rounded-full bg-black text-white text-lg font-semibold shadow-lg hover:bg-gray-800 transition disabled:opacity-50">
    Analyze Message
  </button>
</section>

<!-- RIGHT -->
<section class="w-1/2 border-l p-10 flex flex-col gap-6 overflow-hidden">

  <!-- RESULT -->
  <div id="result-card"
       role="status" aria-live="polite"
       class="flex-1 rounded-2xl border flex flex-col items-center justify-center text-center p-6">
    <span class="material-icons-round text-4xl mb-3 text-gray-400">analytics</span>
    <h3 id="result-title" class="text-xl font-semibold mb-2">Ready to Analyze</h3>
    <p id="result-text" class="text-gray-500">
      Enter a message on the left and hit analyze to see the prediction result here.
    </p>
  </div>

  <!-- HISTORY -->
  <div class="flex items-center justify-between text-sm text-gray-500">
    <span class="font-semibold">RECENT HISTORY</span>
    <button type="button" onclick="clearHistory()" class="text-black hover:underline">Clear All</button>
  </div>

  <div class="flex-1 overflow-y-auto border rounded-2xl">
    <ul id="history"></ul>
  </div>

</section>
</div>
</main>

<!-- SCRIPT -->
<script>
// -----------------------------------------------------------------------
// Config — override without editing this file by appending ?api=<origin>,
// e.g. index.html?api=http://192.168.0.10:5000
// -----------------------------------------------------------------------
const defaultApi = (window.location.origin && window.location.origin !== "null" && !window.location.protocol.startsWith("file"))
  ? window.location.origin
  : "http://127.0.0.1:5000";
const API_BASE_URL = new URLSearchParams(location.search).get("api") || defaultApi;

// Abort the request if the backend does not answer within this many ms.
const REQUEST_TIMEOUT_MS = 15000;

// History lives in this browser only (localStorage) and is capped at LIMIT items.
const HISTORY_KEY = "spam-detector-history";
const HISTORY_LIMIT = 20;

// -----------------------------------------------------------------------
// DOM refs
// -----------------------------------------------------------------------
const analyzeBtn   = document.getElementById("analyze-btn");
const messageInput = document.getElementById("message");
const resultTitle  = document.getElementById("result-title");
const resultText   = document.getElementById("result-text");
const historyList  = document.getElementById("history");
const charCount    = document.getElementById("char-count");

// -----------------------------------------------------------------------
// Helpers
// -----------------------------------------------------------------------

/** Safely escape a string for insertion into the DOM (prevents XSS). */
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function setSpam() {
  messageInput.value = "Congratulations! You've won ₹50,000 cash prize. Click here to claim now.";
  updateCharCount();
}

function setHam() {
  messageInput.value = "Hey mom, I'll be late for dinner tonight. Don't wait up for me.";
  updateCharCount();
}

// -----------------------------------------------------------------------
// History (kept in localStorage so a refresh does not lose it)
// -----------------------------------------------------------------------
function readHistory() {
  try {
    const stored = JSON.parse(localStorage.getItem(HISTORY_KEY));
    return Array.isArray(stored) ? stored : [];
  } catch {
    return []; // corrupted or unavailable storage — start fresh
  }
}

function writeHistory(items) {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(items.slice(0, HISTORY_LIMIT)));
  } catch {
    /* storage full or blocked — the in-memory UI still works */
  }
}

function renderHistoryItem(item) {
  const isSpam = item.prediction === "Spam";
  const colorClass = isSpam ? "text-red-500" : "text-green-500";
  const li = document.createElement("li");
  li.className = "p-4 border-b text-sm";
  li.innerHTML = `
    <span class="${colorClass} font-bold">${escapeHtml(item.prediction)}</span>
    <span class="text-gray-400 float-right">${escapeHtml(String(item.confidence))}%</span>
    <p class="text-gray-600 mt-1">${escapeHtml(item.text)}</p>
  `;
  return li;
}

function addHistoryEntry(prediction, confidence, text) {
  const items = readHistory();
  items.unshift({
    prediction,
    confidence,
    text: text.length > 80 ? text.slice(0, 80) + "…" : text,
  });
  writeHistory(items);
  historyList.prepend(renderHistoryItem(items[0]));
}

async function loadHistory() {
  historyList.innerHTML = "";
  const localItems = readHistory();
  localItems.forEach((item) => historyList.appendChild(renderHistoryItem(item)));

  try {
    const res = await fetch(\/predictions?limit=\);
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data.predictions) && data.predictions.length > 0) {
        historyList.innerHTML = "";
        data.predictions.forEach((row) => {
          historyList.appendChild(
            renderHistoryItem({
              prediction: row.prediction,
              confidence: row.confidence,
              text: row.message.length > 80 ? row.message.slice(0, 80) + "…" : row.message,
            })
          );
        });
      }
    }
  } catch {
    // If backend /predictions is not reachable or disabled, local storage remains visible
  }
}

function clearHistory() {
  writeHistory([]);
  historyList.innerHTML = "";
}

function updateCharCount() {
  charCount.textContent = `${messageInput.value.length} / 1000`;
}

function setResultState(title, body, colorClass) {
  resultTitle.textContent = title;
  resultTitle.className   = `text-2xl font-bold ${colorClass}`;
  resultText.textContent  = body;
}

// -----------------------------------------------------------------------
// Events
// -----------------------------------------------------------------------
messageInput.addEventListener("input", updateCharCount);

messageInput.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    analyzeBtn.click();
  }
});

analyzeBtn.addEventListener("click", async () => {
  const msg = messageInput.value.trim();
  if (!msg) {
    setResultState("Nothing to analyze", "Type or paste a message on the left first.", "text-amber-500");
    messageInput.focus();
    return;
  }

  analyzeBtn.disabled = true;
  setResultState("Analyzing…", "Please wait…", "text-gray-500");

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

  try {
    const res = await fetch(`${API_BASE_URL}/predict`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg }),
      signal: controller.signal,
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `Server error (${res.status})`);
    }

    const data = await res.json();
    const isSpam     = data.prediction === "Spam";
    const colorClass = isSpam ? "text-red-500" : "text-green-500";

    setResultState(
      isSpam ? "🚨 Spam Detected" : "✅ Looks Safe (Ham)",
      `Confidence: ${data.confidence}%`,
      colorClass
    );

    // renderHistoryItem escapes every field, so message text cannot inject HTML
    addHistoryEntry(data.prediction, data.confidence, msg);
  } catch (err) {
    const failure =
      err.name === "AbortError"
        ? `Request timed out after ${REQUEST_TIMEOUT_MS / 1000}s — is the backend running on ${API_BASE_URL}?`
        : err.message || "Could not reach the backend.";
    setResultState("Error", failure, "text-red-400");
  } finally {
    clearTimeout(timer);
    analyzeBtn.disabled = false;
  }
});

// Restore saved history and sync the character counter on first paint.
loadHistory();
updateCharCount();
</script>

</body>
</html>
